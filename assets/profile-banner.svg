<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Hugo — Full-Stack Development, Cybersecurity and Network Infrastructure</title>
  <desc id="description">Professional profile banner with an abstract network and terminal interface.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16" />
      <stop offset="0.55" stop-color="#0b1730" />
      <stop offset="1" stop-color="#101a36" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.32" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#background)" />
  <rect width="1280" height="400" rx="24" fill="url(#glow)" />
  <rect width="1280" height="400" rx="24" fill="url(#grid)" />

  <g fill="none" stroke="#60a5fa" stroke-opacity="0.26" stroke-width="1.5">
    <path d="M32 318 L122 260 L206 306 L302 236 L382 280 L456 220" />
    <path d="M872 45 L940 104 L1024 62 L1100 124 L1238 76" />
    <path d="M1018 306 L1098 258 L1170 304 L1248 250" />
  </g>
  <g fill="#60a5fa" filter="url(#soft-glow)">
    <circle cx="122" cy="260" r="3" />
    <circle cx="206" cy="306" r="3" />
    <circle cx="302" cy="236" r="3" />
    <circle cx="940" cy="104" r="3" />
    <circle cx="1024" cy="62" r="3" />
    <circle cx="1100" cy="124" r="3" />
    <circle cx="1098" cy="258" r="3" />
    <circle cx="1170" cy="304" r="3" />
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="130" fill="#f8fafc" font-size="68" font-weight="760" letter-spacing="2">HUGO</text>
    <rect x="74" y="153" width="510" height="4" rx="2" fill="url(#accent)" />
    <text x="74" y="202" fill="#7dd3fc" font-size="25" font-weight="650" letter-spacing="1.2">FULL-STACK DEVELOPMENT</text>
    <text x="74" y="242" fill="#c7d2fe" font-size="23" font-weight="600" letter-spacing="0.8">CYBERSECURITY · NETWORK INFRASTRUCTURE</text>
    <text x="74" y="295" fill="#94a3b8" font-size="18">Secure applications. Reliable systems. Ideas built end to end.</text>
    <text x="74" y="336" fill="#64748b" font-size="15" letter-spacing="1.4">FRANCE  /  WEB  /  MOBILE  /  INFRASTRUCTURE</text>
  </g>

  <g transform="translate(805 103)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect width="397" height="218" rx="14" fill="#030712" fill-opacity="0.82" stroke="#334155" />
    <rect x="1" y="1" width="395" height="39" rx="13" fill="#111827" />
    <path d="M1 40 H396" stroke="#334155" />
    <circle cx="22" cy="21" r="5" fill="#fb7185" />
    <circle cx="41" cy="21" r="5" fill="#fbbf24" />
    <circle cx="60" cy="21" r="5" fill="#34d399" />
    <text x="84" y="26" fill="#64748b" font-size="12">mentalofcrow@github</text>

    <text x="24" y="78" fill="#38bdf8" font-size="15">$</text>
    <text x="44" y="78" fill="#e2e8f0" font-size="15">build --secure --reliable</text>
    <text x="24" y="112" fill="#64748b" font-size="14">[01]</text>
    <text x="66" y="112" fill="#a5b4fc" font-size="14">full-stack</text>
    <text x="195" y="112" fill="#34d399" font-size="14">ready</text>
    <text x="24" y="142" fill="#64748b" font-size="14">[02]</text>
    <text x="66" y="142" fill="#a5b4fc" font-size="14">security</text>
    <text x="195" y="142" fill="#34d399" font-size="14">enabled</text>
    <text x="24" y="172" fill="#64748b" font-size="14">[03]</text>
    <text x="66" y="172" fill="#a5b4fc" font-size="14">networking</text>
    <text x="195" y="172" fill="#34d399" font-size="14">connected</text>
    <text x="24" y="201" fill="#38bdf8" font-size="15">▌</text>
  </g>
</svg>
